<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainLive — Bitcoin Live</title>

    <style>
        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        .brand {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .status {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
        }

        .bitcoin {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .label {
            font-size: 18px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="brand">CHAINLIVE</div>

        <div class="status">● LIVE — BITCOIN</div>

        <div class="bitcoin" id="price">Loading...</div>

        <div class="label">BTC / USD</div>

    </div>

</body>
</html>
